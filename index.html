<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#195933"><title>Coach Tactics Pro</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:light dark;--bg:#eef1ed;--panel:#fff;--text:#162019;--muted:#667168;--line:#d3dad4;--grass:#237a45;--orange:#f28c28} @media(prefers-color-scheme:dark){:root{--bg:#101612;--panel:#172019;--text:#eef4ef;--muted:#a8b3aa;--line:#354238}}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.brand{font-weight:850;font-size:18px}.brand small{display:block;font-size:11px;color:var(--muted)}.spacer{flex:1}.btn,.field{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:8px 10px}.btn{cursor:pointer}.primary{background:var(--orange);border-color:var(--orange);color:#21150a;font-weight:800}.danger{color:#b42318}.layout{max-width:1700px;margin:auto;padding:12px;display:grid;grid-template-columns:250px minmax(0,1fr) 320px;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.panel h3{margin:0 0 9px}.label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:7px 0 4px}.field{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.list{display:flex;flex-direction:column;gap:6px}.item{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px}.item.active{border-color:var(--orange)}.item .pick{flex:1;border:0;background:transparent;color:inherit;text-align:left;padding:5px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{font-size:12px;color:var(--muted)}.pitchwrap{background:#173e25;border-radius:16px;padding:9px}.pitch{width:100%;display:block;background:var(--grass);border-radius:10px;touch-action:pan-y}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}.textarea{min-height:76px;resize:vertical}.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850;margin:12px 0 6px}.nudge{display:flex;gap:6px;justify-content:center;margin-top:8px}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px}.right{display:flex;flex-direction:column;gap:12px}@media(max-width:1050px){.layout{grid-template-columns:220px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:7px}.left{order:2}.center{order:1}.right{order:3;grid-column:auto;display:flex}.two{grid-template-columns:1fr}.btn,.field{font-size:16px}}
</style></head><body>
<header class="top"><div class="brand">Coach Tactics Pro<small>offline-first match planner</small></div><select id="teamSelect" class="field" style="width:auto"></select><button id="addTeam" class="btn">+ Team</button><button id="delTeam" class="btn danger">Delete</button><div class="spacer"></div><button id="exportBtn" class="btn">Export backup</button><label class="btn">Import backup<input id="importFile" type="file" accept="application/json" hidden></label></header>
<main class="layout">
<aside class="panel left"><h3>Team</h3><label class="label">Name</label><input id="teamName" class="field"><div class="two"><div><label class="label">Game format</label><select id="format" class="field"><option>11v11</option><option>9v9</option><option>8v8</option><option>7v7</option><option>6v6</option><option>5v5</option></select></div><div><label class="label">Formation</label><select id="formation" class="field"></select></div></div><button id="applyFormation" class="btn primary" style="width:100%;margin-top:8px">Apply formation</button><div class="section">Roster</div><div id="roster" class="list"></div><button id="addPlayer" class="btn" style="width:100%;margin-top:8px">+ Add player</button></aside>
<section class="center"><div class="pitchwrap"><svg id="pitch" class="pitch" viewBox="0 0 1000 650" aria-label="Interactive soccer tactics board"><defs><pattern id="grass" width="200" height="650" patternUnits="userSpaceOnUse"><rect width="100" height="650" fill="#247a45"/><rect x="100" width="100" height="650" fill="#21713f"/></pattern></defs><rect x="20" y="20" width="960" height="610" rx="8" fill="url(#grass)" stroke="#eef7ef" stroke-width="4"/><g id="lanes"></g><line x1="500" y1="20" x2="500" y2="630" stroke="#eef7ef" stroke-width="3"/><circle cx="500" cy="325" r="82" fill="none" stroke="#eef7ef" stroke-width="3"/><circle cx="500" cy="325" r="5" fill="#eef7ef"/><rect x="20" y="170" width="145" height="310" fill="none" stroke="#eef7ef" stroke-width="3"/><rect x="835" y="170" width="145" height="310" fill="none" stroke="#eef7ef" stroke-width="3"/><rect x="20" y="245" width="58" height="160" fill="none" stroke="#eef7ef" stroke-width="3"/><rect x="922" y="245" width="58" height="160" fill="none" stroke="#eef7ef" stroke-width="3"/><g id="opponents"></g><g id="players"></g><g id="ball"></g></svg></div><div class="tools"><button id="oppBtn" class="btn">Show opponent</button><button id="laneBtn" class="btn">5 lanes</button><select id="bias" class="field" style="width:auto"><option value="left">Defend left</option><option value="center">Defend center</option><option value="right">Defend right</option></select><span class="badge">drag players + ball</span></div><div class="panel"><div class="two"><div><label class="label">Phase name</label><input id="phaseName" class="field" value="New phase"></div><div style="align-self:end"><button id="savePhase" class="btn primary" style="width:100%">+ Save phase</button></div></div><label class="label">Coaching notes / triggers</label><textarea id="phaseNotes" class="field textarea" placeholder="Triggers, cues, progression, opponent behavior..."></textarea><div class="tools"><button id="play" class="btn">▶ Animate</button><button id="stop" class="btn">■ Stop</button></div><div id="status" class="status" aria-live="polite"></div></div></section>
<aside class="right"><section class="panel"><h3>Selected player</h3><div id="editor" hidden><label class="label">Name</label><input id="pName" class="field"><div class="two"><div><label class="label">Role</label><input id="pRole" class="field"></div><div><label class="label">#</label><input id="pNum" class="field" type="number" min="0" max="99"></div></div><div class="nudge"><button class="btn" data-nudge="-14,0">←</button><button class="btn" data-nudge="0,-14">↑</button><button class="btn" data-nudge="0,14">↓</button><button class="btn" data-nudge="14,0">→</button></div></div><div class="tiny">Tap a player to edit. Drag to move.</div></section><section class="panel"><h3>Saved phases</h3><div id="scenes" class="list"></div></section><section class="panel"><h3>Match plan</h3><div class="two"><div><label class="label">Opponent</label><input id="matchOpponent" class="field"></div><div><label class="label">Date</label><input id="matchDate" class="field" type="date"></div></div><label class="label">Venue</label><input id="venue" class="field"><label class="label">Objectives / opponent notes</label><textarea id="objectives" class="field textarea"></textarea><button id="saveMatch" class="btn primary" style="width:100%;margin-top:8px">Save match plan</button><div class="section">Saved matches</div><div id="matches" class="list"></div></section></aside>
</main><script src="app.js"></script></body></html>
